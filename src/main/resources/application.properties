spring.application.name=ginete-api
server.servlet.context-path=/api

#Auth
ginete.auth.admin.username=${ADMIN_USERNAME}
ginete.auth.admin.password=${ADMIN_PASSWORD}

ginete.auth.jwt.issuer=ginete-api
ginete.auth.jwt.secret=${JWT_SECRET}
ginete.auth.jwt.expiration=${JWT_EXPIRATION:1h}

#CORS
ginete.cors.allowed-origins=http://localhost:5173

#MongoDb
#spring.mongodb.uri=${MONGODB_LOCAL_URI}
spring.mongodb.uri=${MONGODB_LOCAL_URL}

#Redis
#spring.data.redis.url=${REDIS_URI}
#spring.data.redis.timeout=60000ms
#spring.data.redis.ssl.enabled=true

spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=${REDIS_PORT}

#Servidor de Downloads Youtube
spring.cloud.openfeign.client.config.youtube-media.url=${DOWNLOAD_SERVICE_URL}
spring.cloud.openfeign.client.config.youtube-media.logger-level=full

#Documentação
springdoc.swagger-ui.operations-sorter=method

